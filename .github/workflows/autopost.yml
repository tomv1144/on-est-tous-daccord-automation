name: On Est Tous d'Accord Autopost

on:
  schedule:
    # 16:30 UTC = 18:30 à Paris en été (CEST) / 17:30 à Paris en hiver (CET).
    # Décalage d'1h en hiver, sans conséquence pour ce type de publication.
    - cron: "30 16 * * *"
  workflow_dispatch: {}   # permet de lancer le workflow manuellement depuis GitHub pour tester

permissions:
  contents: write   # nécessaire pour que le script puisse commit + push les visuels et l'historique

jobs:
  autopost:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        
      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
        
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install Pillow numpy scipy pytrends

      - name: Lancer l'agent de publication
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: python tousdaccord_autopost.py
