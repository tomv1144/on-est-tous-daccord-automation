name: TEST - Casting du style des personnages (Corgi + Golden)

# Comme poc_test.yml, ce workflow ne se lance jamais tout seul : c'est un
# test à lancer à la main, pour choisir le style visuel des personnages
# avant de reconstruire le pipeline complet. Aucun effet sur les
# publications Facebook/Instagram normales.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  casting-test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install Pillow

      - name: Lancer le casting (génère les 8 images + la planche récap)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python casting_personnages.py

      # "if: always()" : sauvegarde ce qui a été généré même si le casting
      # s'arrête en cours de route (panne, crédit épuisé...).
      - name: Enregistrer le résultat dans le dépôt
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add casting_output/
          git diff --cached --quiet || git commit -m "Casting : styles Corgi + Golden (meme partiel)"
          git push

